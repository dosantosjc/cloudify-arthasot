<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Minha conta - Cloudify</title>
    <link rel="icon" href="/images/favicon-sm.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/conta.css" />
    <link rel="stylesheet" href="/css/dashboard.css" />
  </head>

  <body class="dash carregando" data-visao="geral">
    <aside class="lateral">
      <a class="lateral__marca" href="/" aria-label="Cloudify"><img src="/images/logo.svg" alt="" /></a>
      <div class="lateral__perfil">
        <span class="avatar avatar--grande" id="avatar" hidden></span>
        <p id="saudacao">Carregando...</p>
        <button type="button" id="sair">Sair</button>
      </div>
      <nav class="lateral__menu" aria-label="Painel">
          <button type="button" data-ir="geral" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg><span>Visão Geral</span></button>
          <button type="button" data-ir="sites"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/></svg><span>Meus Sites</span></button>
          <button type="button" data-ir="plano"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h4"/></svg><span>Meu Plano</span></button>
          <button type="button" data-ir="config"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg><span>Configurações</span></button>
      </nav>
    </aside>

    <main class="conteudo">
      <h1 id="titulo">Visão Geral</h1>
      <div class="quadro" id="painel">
        <section class="caixa caixa--plano">
          <div class="plano__resumo">
            <h2>Meu Plano</h2>
            <p class="destaque" id="plano-nome">Nenhum plano ativo</p>
            <p id="plano-preco"></p>
            <p class="menor" id="plano-desde"></p>
            <a class="btn btn--accent" id="plano-link" href="/#planos">Ver planos</a>
          </div>
          <ul class="list plano__itens" id="plano-itens"></ul>
        </section>

        <section class="caixa caixa--geral">
          <h2>Status Geral</h2>
          <div class="barra" aria-hidden="true"><span id="geral-barra"></span></div>
          <p id="geral-texto" role="status">Verificando...</p>
        </section>

        <section class="caixa caixa--sites">
          <h2 class="caixa__titulo">Meus Sites</h2>
          <div class="caixa__corpo">
            <ul class="list sites" id="sites"></ul>
            <p id="sites-aviso" class="aviso" role="status"></p>
            <button type="button" class="verificar" id="site-atualizar">&#8635; Verificar novamente</button>
          </div>
        </section>

        <section class="caixa caixa--dados">
          <h2 class="caixa__titulo">Meus Dados &amp; Configurações</h2>
          <div class="abas">
            <button type="button" data-aba="dados" aria-pressed="true">Dados pessoais</button>
            <button type="button" data-aba="email" aria-pressed="false">Alterar e-mail</button>
            <button type="button" data-aba="senha" aria-pressed="false">Alterar senha</button>
          </div>

          <div class="caixa__corpo" id="aba-dados">
            <form id="dados-form" class="campos">
              <div>
                <label for="nome">Nome</label>
                <input class="input" id="nome" type="text" maxlength="100" autocomplete="name" required />
              </div>
              <div>
                <label for="telefone">Telefone</label>
                <input class="input" id="telefone" type="tel" maxlength="20" autocomplete="tel" />
              </div>
              <div>
                <label for="email">E-mail</label>
                <input class="input" id="email" type="email" readonly />
              </div>
              <div>
                <label for="empresa">Empresa</label>
                <input class="input" id="empresa" type="text" maxlength="100" autocomplete="organization" />
              </div>
              <div class="foto-acoes">
                <input type="file" id="foto" accept="image/jpeg,image/png,image/webp" />
                <label for="foto">Alterar foto de perfil</label>
                <button type="button" id="foto-remover" hidden>Remover foto</button>
              </div>
              <button type="submit" class="btn btn--accent">Salvar dados</button>
            </form>
            <p id="foto-aviso" class="aviso" role="status"></p>
            <p id="dados-aviso" class="aviso" role="status"></p>
          </div>

          <div class="caixa__corpo" id="aba-email" hidden>
            <form id="email-form" method="post" class="campos">
              <div>
                <label for="novo-email">Novo e-mail</label>
                <input class="input" id="novo-email" type="email" autocomplete="email" required />
              </div>
              <button type="submit" class="btn btn--accent">Alterar e-mail</button>
            </form>
            <p id="email-aviso" class="aviso" role="status"></p>
          </div>

          <div class="caixa__corpo" id="aba-senha" hidden>
            <form id="senha-form" method="post" class="campos">
              <div>
                <label for="nova-senha">Nova senha</label>
                <input class="input" id="nova-senha" type="password" minlength="8" autocomplete="new-password" required />
              </div>
              <div>
                <label for="confirmar-senha">Confirmar nova senha</label>
                <input class="input" id="confirmar-senha" type="password" minlength="8" autocomplete="new-password" required />
              </div>
              <button type="submit" class="btn btn--accent">Alterar senha</button>
            </form>
            <p id="senha-aviso" class="aviso" role="status"></p>
          </div>
        </section>

        <section class="caixa caixa--financeiro">
          <h2 class="caixa__titulo">Resumo Financeiro</h2>
          <div class="caixa__corpo">
            <div class="fatura">
              <div>
                <p class="menor">Próxima fatura</p>
                <p class="destaque" id="fatura-valor">—</p>
                <p id="fatura-data" role="status">Carregando...</p>
              </div>
              <div class="fatura__acoes">
                <span class="status" id="fatura-status" hidden></span>
                <a class="btn btn--accent" id="fatura-pagar" target="_blank" rel="noopener" hidden>Pagar agora</a>
              </div>
            </div>
            <div id="historico" hidden>
              <h3>Últimos pagamentos</h3>
              <ul class="list" id="historico-lista"></ul>
            </div>
          </div>
        </section>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <script src="/js/config.js"></script>
    <script src="/js/avatar.js"></script>
    <script src="/js/dashboard.js"></script>
  </body>
</html>
