<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Recuperar senha - Cloudify</title>
    <link rel="icon" href="/images/favicon-sm.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/conta.css" />
  </head>

  <body>
    <main class="login">
      <a class="login__brand" href="https://www.arthasot.com.br/" aria-label="Cloudify"
        ><img src="/images/logo.svg" alt=""
      /></a>

      <div class="card login__card">
        <h1 class="login__title">Recuperar senha</h1>
        <p class="login__text">Enviaremos um link para você criar uma nova senha.</p>

        <form id="recuperar-form" method="post">
          <label class="login__label" for="email">E-mail</label>
          <input class="input" id="email" type="email" autocomplete="email" required />

          <div id="captcha" class="captcha"></div>

          <button type="submit" class="btn btn--accent btn--block">Enviar link</button>
          <p id="aviso" class="aviso" role="status"></p>
        </form>

        <p class="login__switch">Lembrou a senha? <a href="/login">Entrar</a></p>
      </div>

      <a class="login__back" href="https://www.arthasot.com.br/">&larr; Voltar para o site</a>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit"></script>
    <script src="/js/config.js"></script>
    <script src="/js/captcha.js"></script>
    <script src="/js/senha.js"></script>
  </body>
</html>
